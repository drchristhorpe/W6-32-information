[project]
name = "interface-contacts"
version = "0.1.0"
description = "Map a protein-protein interface as a heavy-atom contact set (epitope/paratope footprints) using BioPython NeighborSearch."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "biopython>=1.87",
]

[project.scripts]
interface-contacts = "interface_contacts:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["interface_contacts.py"]
