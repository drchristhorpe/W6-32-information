[project]
name = "mutate-sequence"
version = "0.1.0"
description = "Apply precise, validated point mutations to a sequence from a JSON spec."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
mutate-sequence = "mutate_sequence:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["mutate_sequence.py"]
