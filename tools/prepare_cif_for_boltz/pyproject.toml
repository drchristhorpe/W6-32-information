[project]
name = "prepare-cif-for-boltz"
version = "0.1.0"
description = "Reconstruct mmCIF polymer metadata (entity_poly_seq, struct_asym, auth_seq_id) stripped by viewer exports, for BoltzGen structure-template design."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "gemmi>=0.7",
]

[project.scripts]
prepare-cif-for-boltz = "prepare_cif_for_boltz:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["prepare_cif_for_boltz.py"]
