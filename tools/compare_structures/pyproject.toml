[project]
name = "compare-structures"
version = "0.1.0"
description = "Fine-scale global + per-residue deviation between two structures over a residue selection (sequence-paired, in-frame or superposed)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "biopandas>=0.5.1",
    "biopython>=1.87",
    "numpy",
]

[project.scripts]
compare-structures = "compare_structures:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["compare_structures.py"]
