[project]
name = "align-structure"
version = "0.1.0"
description = "Superpose a structure onto a canonical reference frame, fitting on a sequence-matched residue selection (e.g. MHC-I alpha1/alpha2 CA)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "biopython>=1.87",
]

[project.scripts]
align-structure = "align_structure:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["align_structure.py"]
