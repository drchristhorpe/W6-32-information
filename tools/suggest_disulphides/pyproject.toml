[project]
name = "suggest-disulphides"
version = "0.1.0"
description = "Propose engineerable disulphide bonds between residue selections, modelling Sγ rotamers and checking Sγ-Sγ / χ3 geometry."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "biopython>=1.87",
    "numpy",
]

[project.scripts]
suggest-disulphides = "suggest_disulphides:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["suggest_disulphides.py"]
