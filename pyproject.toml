[project]
name = "w632-tools"
version = "0.1.0"
description = "Composable structural-biology tools for the W6/32 information experiment (align, interface contacts, compare)"
readme = "README.md"
authors = [
    { name = "Chris Thorpe", email = "33100149+drchristhorpe@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "align-structure",
    "interface-contacts",
]

[tool.uv.sources]
align-structure = { path = "tools/align_structure", editable = true }
interface-contacts = { path = "tools/interface_contacts", editable = true }

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"
